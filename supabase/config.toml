# Supabase CLI configuration for the local development stack.
# Only settings that differ from the CLI defaults, plus the ports in use.
project_id = "busybuddy"

[api]
enabled = true
port = 54321
# The `private` schema (membership helpers) is deliberately not exposed.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true
