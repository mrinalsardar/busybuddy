name: Deploy backend

# Database tests, then qa, then prd after a reviewer approves it.
# Setup: docs/hosted-setup.md.
#
# Manual only. This repository is public and these jobs hold deploy secrets, so
# never add pull_request, pull_request_target or workflow_run: code from a fork
# must not reach them.
on:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. This does not stop a re-run of an older run, which
# deploys its older commit again: see docs/hosted-setup.md. A run that waits for
# approval holds the queue: approve or reject it.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  test:
    name: database tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # An early, readable failure. The enforcement is each environment's
      # "deployment branches" rule, because a branch can edit this file.
      - name: Require the main branch
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::error::Deploys run from main only, not $GITHUB_REF."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Same version and commands as ci.yml.
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 3.2.0
      - run: supabase db start
      - run: supabase test db

  qa:
    name: deploy qa
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: qa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-backend
        with:
          target: qa
          deploy-environment: ${{ vars.DEPLOY_ENVIRONMENT }}
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase-project-ref: ${{ vars.SUPABASE_PROJECT_REF }}
          powersync-admin-token: ${{ secrets.PS_ADMIN_TOKEN }}
          powersync-instance-id: ${{ vars.POWERSYNC_INSTANCE_ID }}

  # GitHub creates a missing environment without any protection, and would then
  # run the prd job unapproved. This job names no environment, so it creates
  # none, and it stops the run unless the rules exist.
  prd-gate:
    name: check prd protection
    needs: qa
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require reviewers and a branch rule on the prd environment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          fail() {
            echo "::error::$1 See docs/hosted-setup.md."
            exit 1
          }
          config=$(gh api "repos/$GITHUB_REPOSITORY/environments/prd") \
            || fail "Cannot read the GitHub Environment 'prd'. Does it exist?"
          jq -e 'any(.protection_rules[]?; .type == "required_reviewers" and (.reviewers | length) > 0)' <<<"$config" >/dev/null \
            || fail "The GitHub Environment 'prd' has no required reviewers."
          jq -e '.deployment_branch_policy != null' <<<"$config" >/dev/null \
            || fail "The GitHub Environment 'prd' does not restrict deployment branches."

  prd:
    name: deploy prd
    needs: prd-gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Waits here for a required reviewer.
    environment: prd
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/deploy-backend
        with:
          target: prd
          deploy-environment: ${{ vars.DEPLOY_ENVIRONMENT }}
          supabase-access-token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          supabase-db-password: ${{ secrets.SUPABASE_DB_PASSWORD }}
          supabase-project-ref: ${{ vars.SUPABASE_PROJECT_REF }}
          powersync-admin-token: ${{ secrets.PS_ADMIN_TOKEN }}
          powersync-instance-id: ${{ vars.POWERSYNC_INSTANCE_ID }}
