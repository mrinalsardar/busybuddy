name: busybuddy
description: "A local-first retail POS and inventory management app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # Database (local SQLite synced to Supabase through PowerSync)
  powersync: ^2.6.2
  sqlite_async: ^0.14.8
  supabase_flutter: ^2.18.3
  path: ^1.9.1
  path_provider: ^2.1.6

  # State management
  flutter_riverpod: ^3.5.0
  riverpod_annotation: ^4.0.8

  # Navigation
  go_router: ^18.1.4

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.2
  equatable: ^3.0.0
  json_annotation: ^4.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.10
  # Fake HTTP client for the Supabase upload connector tests.
  http: ^1.6.0

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
