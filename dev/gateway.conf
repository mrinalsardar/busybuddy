# API gateway for the local stack: the same /auth/v1 and /rest/v1 paths as
# Supabase, plus the email templates that Auth fetches.
server {
    listen 8000;

    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $http_host;
    }

    # Resolved on each request (variable in proxy_pass), so the gateway keeps
    # working when the storage container is restarted and gets a new address.
    location /storage/v1/ {
        resolver 127.0.0.11 valid=2s;
        set $storage_upstream http://storage:5000;
        rewrite ^/storage/v1/(.*)$ /$1 break;
        client_max_body_size 50m;
        proxy_pass $storage_upstream;
        proxy_set_header Host $http_host;
    }

    location /templates/ {
        alias /usr/share/nginx/templates/;
    }
}
